# ========== 机器人配置 ==========
robot:
  type: "gr3"   # 切换机器人只改这个标识："xoip"/"sim"/"can_bus"...
  port: 5000
  # 可选：机器人专属关节限位、坐标系符号（如果不同机器人标定不一样）

# 按钮映射 (来自 read_exo.py 的 button 数组)
BTN_L_WHITE: 3  # 白色按钮 (L_B3, 0x0008) — 归位
BTN_L_BLUE: 2   # 蓝色按钮 (L_B2, 0x0004) — 录制开关
# 红色按钮 = exo_data["red_button"] (L_B1, 0x0002) — 遥操作使能

# 归位目标 轮臂人形机器人
HOME_LEFT: [0, 0.3,  0.0,  -0.5,  0,  0,  0]
HOME_RIGHT: [0, 0.3,  0.0,  -0.5,  0,  0,  0]

# ========== 新增：外骨骼全部标定配置 ==========
exo:
  port: "/dev/ttyACM1"
  baudrate: 2000000
  red_button_mask: 0x0002

  sign_flip_left: [1, -1, 1, -1, -1, 1, -1]
  sign_flip_right: [-1, -1, 1, -1, -1, 1, -1]


  zero_offsets_left: [2, 1.57, 0, -1.57, 0, 0, 0]
  zero_offsets_right: [-2, -1.57, 0, -1.57, 0, 0, 0]

  joint_limits:
    # L0~L6
    - [-1.5708, 1.5708]
    - [0, 1.5708]
    - [-0.5236, 1.5708]
    - [-1.5708, 0]
    - [-3.1416, 3.1416]
    - [-1.0472, 1.0472]
    - [-1.0472, 1.0472]
    # R0~R6
    - [-1.5708, 1.5708]
    - [0, 1.5708]
    - [-1.5708, 0.5236]
    - [-1.5708, 0]
    - [-3.1416, 3.1416]
    - [-1.0472, 1.0472]
    - [-1.0472, 1.0472]

# ========== 数据录制定义 ==========
# 遥操作采集配置文件
DATASET_NAME: "exo_teleop_n1"
OUTPUT_ROOT: "data/datasets_v3"
FPS: 30
NUM_JOINTS: 14          # NUM_JONINTS的数量需要和state_names的数量匹配
CAMERA_WIDTH: 640
CAMERA_HEIGHT: 480
CAMERA_INDICES: [0, 2, 4]  # 多摄像头索引
STREAM_FREQ: 100           # 机器人控制线程发送频率 (Hz)

name_lists:
  state_names:
    - L_shoulder_pitch
    - L_shoulder_roll
    - L_shoulder_yaw
    - L_elbow
    - L_forearm_roll
    - L_wrist_pitch
    - L_wrist_roll
    - R_shoulder_pitch
    - R_shoulder_roll
    - R_shoulder_yaw
    - R_elbow
    - R_forearm_roll
    - R_wrist_pitch
    - R_wrist_roll
    # - L_hand_j0
    # - L_hand_j1
    # - L_hand_j2
    # - L_hand_j3
    # - L_hand_j4
    # - L_hand_j5
    # - R_hand_j0
    # - R_hand_j1
    # - R_hand_j2
    # - R_hand_j3
    # - R_hand_j4
    # - R_hand_j5

  joystick_names:
    - L_axis_x
    - L_axis_y
    - L_trigger
    - R_axis_x
    - R_axis_y
    - R_trigger
  button_names:
    - L_B0
    - L_B1
    - L_B2
    - L_B3
    - R_B0
    - R_B1
    - R_B2
    - R_B3

# ========== Feature 完整规格定义【核心】 ==========
feature_specs:
  observation.state:
    dtype: float32
    ref_name_list: state_names    # 关联上方name_lists内的key
  action:
    dtype: float32
    ref_name_list: state_names
  observation.joystick:
    dtype: float32
    ref_name_list: joystick_names
  observation.button:
    dtype: int64
    ref_name_list: button_names
