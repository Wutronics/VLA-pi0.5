schema_version: 1
controller:
  sdk_class: CArmDualBot
  address_env: D3_CONTROLLER_ADDRESS

scope:
  command_left_arm: false
  command_right_arm: true
  observe_left_arm: true
  observe_right_arm: true

motion:
  representation: joint
  degrees_of_freedom_per_arm: 7
  enable_motion_by_default: false
  reset_on_connect: false
  reset_pose: null
  max_joint_step_deg: 2.0
  minimum_move_duration_s: 3.0
  command_rate_hz: null # Required only after tracked-control validation.
  stale_command_timeout_ms: 250
  tracking_enabled: false

gripper:
  enabled: false # No gripper command is part of the initial right-arm baseline.
  open_position: null
  closed_position: null
  close_force: null

safety:
  workspace_limits: null
  joint_limits: null
  velocity_limits: null
  acceleration_limits: null
  emergency_stop_verified: false
  global_task_stop_verified: false
  require_servo_enabled: true
  require_position_mode: true
  command_log_path: artifacts/evaluation/d3-right-arm-command.jsonl

notes:
  - Populate only from delivered D3 configuration and measured tests; do not infer limits from MuJoCo.
  - Never copy the hard-coded reset joint values from the vendor example without validation.
  - Keep tracking_enabled false until a separate process has validated task_stop during a safe, observed test.
